<div class="historico-page">
  <div class="search-card">
    <div class="search-header">
      <span class="material-icons">manage_search</span>
      <h2>Pesquisar Cotações</h2>
    </div>
    <div class="search-form">
      <div class="field-group">
        <label for="dataInicial">Data Inicial</label>
        <input
          id="dataInicial"
          type="date"
          name="dataInicial"
          #dataInicial
          [value]="dataInicialString"
          (change)="testeee($any($event.target).value)"
        />
      </div>

      <div class="field-group">
        <label for="dataFinal">Data Final</label>
        <input
          id="dataFinal"
          type="date"
          name="dataFinal"
          #dataFinal
          [value]="dataFinalString"
        />
      </div>

      <div class="field-group toggle-group">
        <label class="toggle-label">
          <input
            id="flagOpcional"
            type="checkbox"
            [(ngModel)]="flagOpcional"
            name="flagOpcional"
          />
          <div class="toggle-switch">
            <div class="toggle-slider"></div>
          </div>
          <span>Apenas menores que cotação atual</span>
        </label>
      </div>

      <button
        class="btn-search"
        (click)="getCotacaoPorPeriodo(dataInicial.value, dataFinal.value)"
      >
        <span class="material-icons">search</span>
        Pesquisar
      </button>
    </div>
  </div>

  <div class="results-area">
    <app-historicolist
      *ngIf="cotacaoPorPeriodoLista.length > 0"
      [cotacoes]="cotacaoPorPeriodoLista"
    ></app-historicolist>
  </div>
</div>
